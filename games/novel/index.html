<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5b4bff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Novel" />
    <link rel="icon" type="image/svg+xml" href="/novel-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/novel-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/novel-icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/novel-apple-touch-icon.png" />
    <link rel="manifest" href="/novel.webmanifest" />
    <title>novel</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --card: #ffffff;
        --text: #1a1a1a;
        --line: #d7dce7;
        --primary: #2f6fff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body {
        padding: 16px 14px 24px;
      }

      .page {
        width: min(94vw, 760px);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px 14px;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 10px;
      }

      .left-actions {
        display: inline-flex;
        gap: 8px;
        justify-self: start;
      }

      .novel-name {
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        line-height: 1.2;
      }

      .icon-btn {
        border: 1px solid var(--line);
        border-radius: 999px;
        min-width: 38px;
        height: 38px;
        background: #fff;
        font-size: 18px;
      }

      .meta {
        margin: 8px 0 0;
        color: #68727f;
        font-size: 14px;
      }

      .content {
        margin-top: 12px;
        min-height: 160px;
        font-size: 19px;
        line-height: 1.9;
        white-space: pre-wrap;
      }

      .submissions-title {
        margin: 14px 0 8px;
        font-size: 16px;
        font-weight: 700;
      }

      .submissions {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .submission-item {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .submission-item.top {
        border-color: #9bb6ff;
        background: #f3f7ff;
      }

      .submission-meta {
        color: #5d6472;
      }

      .more-inline-btn {
        min-height: 32px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }

      .pager {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 10px;
        align-items: center;
      }

      .btn {
        border: 1px solid var(--line);
        border-radius: 10px;
        min-height: 44px;
        padding: 0 12px;
        font-size: 16px;
        font-weight: 600;
        background: #fff;
        color: var(--text);
      }

      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }

      .field {
        margin-top: 10px;
      }

      .input,
      .textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        font-size: 16px;
      }

      .textarea {
        min-height: 130px;
        resize: vertical;
      }

      .count {
        margin-top: 6px;
        text-align: right;
        font-size: 12px;
        color: #76808f;
      }

      .popup {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(0, 0, 0, 0.28);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .popup.is-open {
        display: flex;
      }

      .popup-card {
        width: min(92vw, 430px);
        background: #fff;
        border-radius: 14px;
        padding: 16px 14px;
      }

      .popup-line {
        margin: 8px 0;
        font-size: 15px;
      }

      .candidate-scroll {
        max-height: 64vh;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
      }

      .candidate-item {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 14px;
        margin-bottom: 8px;
        background: #fff;
      }

      .candidate-item:last-child {
        margin-bottom: 0;
      }

      .candidate-item .meta {
        margin: 0 0 4px;
      }

      .candidate-load {
        text-align: center;
        color: #68727f;
        font-size: 13px;
        padding: 6px 0 0;
      }

      .status {
        margin-top: 8px;
        font-size: 14px;
        color: #68727f;
      }

      #jump-status {
        color: #d93025;
        font-weight: 700;
        min-height: 20px;
      }

      .jump-icon-btn {
        border: 1px solid var(--line);
        border-radius: 999px;
        min-width: 38px;
        height: 38px;
        background: #fff;
        font-size: 17px;
      }

      .settings-page {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: var(--bg);
        padding: 20px 16px calc(16px + env(safe-area-inset-bottom));
        display: none;
        flex-direction: column;
        gap: 12px;
      }

      .settings-page.is-open {
        display: flex;
      }

      .settings-title {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
      }

      .settings-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .setting-item {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }

      .setting-label {
        font-size: 14px;
        color: #5d6472;
        margin-bottom: 6px;
      }

      .setting-input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        min-height: 42px;
        padding: 0 10px;
        font-size: 15px;
      }

      .setting-check {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
      }

      .nav-page {
        position: fixed;
        inset: 0;
        z-index: 80;
        background: var(--bg);
        padding: 20px 16px calc(16px + env(safe-area-inset-bottom));
        display: none;
        flex-direction: column;
        gap: 12px;
      }

      .nav-page.is-open {
        display: flex;
      }

      .nav-actions {
        margin: auto 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .nav-button {
        width: 100%;
        min-height: 56px;
        font-size: 20px;
        font-weight: 700;
      }

      .guide-focus {
        position: relative;
        z-index: 121;
        border-radius: 12px;
        box-shadow: 0 0 0 3px #7a63ff, 0 10px 26px rgba(39, 21, 119, 0.25);
      }

      .guide-overlay {
        position: fixed;
        inset: 0;
        z-index: 120;
        background: rgba(0, 0, 0, 0.5);
        display: none;
      }

      .guide-overlay.is-open {
        display: block;
      }

      .guide-overlay.is-clear {
        background: transparent;
      }

      .guide-overlay.is-finale {
        background: radial-gradient(circle at 50% 75%, rgba(122, 99, 255, 0.34), rgba(0, 0, 0, 0.56));
      }

      .guide-panel {
        position: fixed;
        left: 50%;
        bottom: max(12px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: min(94vw, 520px);
        background: #fff;
        border-radius: 14px;
        border: 1px solid var(--line);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.22);
        padding: 14px;
      }

      .guide-panel.is-top {
        top: max(12px, env(safe-area-inset-top));
        bottom: auto;
      }

      .guide-panel.is-finale {
        border: 1px solid rgba(129, 92, 255, 0.56);
        background: linear-gradient(135deg, #ffffff 0%, #f4f0ff 55%, #efe9ff 100%);
        box-shadow: 0 18px 40px rgba(80, 42, 174, 0.32);
        animation: finalePulse 1.8s ease-in-out infinite;
      }

      .guide-title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .guide-subtitle {
        margin: 6px 0 0;
        font-size: 13px;
        color: #7b8291;
      }

      .guide-subtitle.is-hidden {
        display: none;
      }

      .guide-panel.is-finale .guide-title {
        font-size: 22px;
        color: #4f2ac0;
      }

      .guide-panel.is-finale .guide-subtitle {
        color: #6b53d2;
        font-size: 14px;
        font-weight: 600;
      }

      .guide-text {
        margin: 8px 0 0;
        line-height: 1.65;
        color: #4a5260;
        font-size: 15px;
      }

      .guide-panel.is-finale .guide-text {
        color: #3e3470;
        font-size: 16px;
      }

      .guide-text-rich {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .guide-text-rich p {
        margin: 0;
        line-height: 1.65;
      }

      .guide-text-rich .highlight {
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid rgba(129, 92, 255, 0.35);
        background: rgba(129, 92, 255, 0.08);
        color: #4f2ac0;
        font-weight: 700;
      }

      .guide-progress {
        margin-top: 10px;
        color: #7b8291;
        font-size: 13px;
      }

      .guide-actions {
        margin-top: 12px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }

      .tree-scroll {
        max-height: 62vh;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        background: #fafbff;
      }

      .tree-item {
        width: 100%;
        text-align: left;
        background: #fff;
        border: 1px solid transparent;
        font-size: 14px;
        line-height: 1.5;
        color: #2f3642;
        margin: 0;
        padding: 6px 8px;
        border-radius: 8px;
        cursor: pointer;
        animation: treeNodeFadeIn 120ms ease;
      }

      .tree-item.current {
        border-color: #9bb6ff;
        background: #edf2ff;
        font-weight: 700;
      }

      .tree-item:hover {
        border-color: #d3dbef;
      }

      @keyframes treeNodeFadeIn {
        from {
          opacity: 0;
          transform: translateY(2px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes finalePulse {
        0% {
          box-shadow: 0 18px 40px rgba(80, 42, 174, 0.28);
        }
        50% {
          box-shadow: 0 22px 46px rgba(80, 42, 174, 0.42);
        }
        100% {
          box-shadow: 0 18px 40px rgba(80, 42, 174, 0.28);
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="topbar">
        <div class="left-actions">
          <button class="btn" id="open-settings-btn">设置</button>
          <button class="btn" id="open-guide-btn">指引</button>
        </div>
        <div class="novel-name" id="novel-name">众创小说</div>
        <button class="icon-btn" id="detail-btn" aria-label="查看详情" style="justify-self: end">i</button>
      </section>

      <section class="card" id="read-card">
        <p class="meta" id="seq-meta">第 1 页</p>
        <div class="content" id="novel-content">加载中...</div>
        <h3 class="submissions-title">下一页候选榜（续写本段）</h3>
        <ul class="submissions" id="submissions-list"></ul>
      </section>

      <section class="pager">
        <button class="btn" id="prev-btn">上一页</button>
        <button class="btn" id="next-btn">下一页</button>
        <button class="jump-icon-btn" id="jump-btn" aria-label="跳转">↗</button>
      </section>

      <section class="card">
        <button class="btn" id="toggle-write-btn" style="width: 100%; margin-bottom: 10px">我要续写</button>
        <div id="write-section">
        <div class="field">
          <textarea
            class="textarea"
            id="continue-input"
            maxlength="400"
            placeholder="开始续写第1页"
          ></textarea>
          <div class="count" id="text-count">0/400</div>
        </div>
        <div class="field">
          <input class="input" id="author-input" maxlength="10" placeholder="输入作者名" />
        </div>
        <div class="field">
          <button class="btn primary" id="submit-btn" style="width: 100%">提交</button>
        </div>
        <div class="status" id="submit-status"></div>
        </div>
      </section>
    </main>

    <section class="settings-page" id="settings-page">
      <div class="settings-header">
        <h2 class="settings-title">设置</h2>
        <button class="btn" id="settings-more-btn">more</button>
      </div>
      <div class="setting-item">
        <div class="setting-label">作者名</div>
        <input class="setting-input" id="setting-author" maxlength="10" placeholder="输入作者名" />
      </div>
      <div class="setting-item">
        <div class="setting-label">小说名</div>
        <input class="setting-input" id="setting-novel-name" maxlength="20" placeholder="输入小说名" />
      </div>
      <div class="setting-item">
        <label class="setting-check">
          <input type="checkbox" id="setting-is-author" />
          <span>我是作者</span>
        </label>
      </div>
      <button class="btn primary" id="save-settings-btn">保存</button>
      <button class="btn" id="close-settings-btn">关闭</button>
    </section>

    <script src="/nav-loader.js" data-nav-variant="novel"></script>

    <div class="popup" id="detail-popup">
      <div class="popup-card">
        <h2 style="margin: 0; font-size: 20px; font-weight: 700">内容详情</h2>
        <p class="popup-line" id="detail-id">内容ID：-</p>
        <p class="popup-line" id="detail-votes">票数：0</p>
        <p class="popup-line" id="detail-author">作者：匿名</p>
        <p class="popup-line" id="detail-time">创建时间：-</p>
        <button class="btn" id="share-btn" style="width: 100%">分享</button>
        <button class="btn" id="tree-btn" style="width: 100%; margin-top: 8px">内容树</button>
        <button class="btn" id="integrate-btn" style="width: 100%; margin-top: 8px">整合</button>
        <div class="status" id="share-status"></div>
        <button class="btn primary" id="like-btn" style="width: 100%">点赞 +1</button>
        <button class="btn" id="close-popup-btn" style="width: 100%; margin-top: 8px">关闭</button>
      </div>
    </div>

    <div class="popup" id="integrate-popup">
      <div class="popup-card" style="width: min(94vw, 760px)">
        <h2 style="margin: 0; font-size: 20px; font-weight: 700">整合内容</h2>
        <div
          id="integrated-content"
          style="
            margin-top: 10px;
            max-height: 58vh;
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            white-space: pre-wrap;
            line-height: 1.7;
          "
        ></div>
        <div class="status" id="integrate-status"></div>
        <button class="btn primary" id="download-pdf-btn" style="width: 100%; margin-top: 8px">
          下载PDF文档
        </button>
        <button class="btn" id="close-integrate-popup-btn" style="width: 100%; margin-top: 8px">
          关闭
        </button>
      </div>
    </div>

    <div class="popup" id="tree-popup">
      <div class="popup-card" style="width: min(94vw, 760px)">
        <h2 style="margin: 0; font-size: 20px; font-weight: 700">内容树</h2>
        <div class="tree-scroll" id="tree-scroll"></div>
        <div class="status" id="tree-status"></div>
        <button class="btn" id="close-tree-popup-btn" style="width: 100%; margin-top: 8px">关闭</button>
      </div>
    </div>

    <div class="popup" id="jump-popup">
      <div class="popup-card">
        <h2 style="margin: 0; font-size: 20px; font-weight: 700">快速跳转</h2>
        <p class="popup-line" id="jump-current-id">当前阅读ID：-</p>
        <p class="popup-line" id="jump-current-seq">当前页序号：-</p>
        <div class="field">
          <input class="input" id="jump-seq-input" type="number" min="1" placeholder="输入页数（序号）" />
          <button class="btn primary" id="jump-seq-go-btn" style="width: 100%; margin-top: 8px">
            按页数跳转
          </button>
        </div>
        <div class="field">
          <input class="input" id="jump-id-input" type="number" min="1" placeholder="输入内容ID" />
          <button class="btn primary" id="jump-id-go-btn" style="width: 100%; margin-top: 8px">
            按ID跳转
          </button>
        </div>
        <div class="status" id="jump-status"></div>
        <button class="btn" id="close-jump-popup-btn" style="width: 100%; margin-top: 8px">关闭</button>
      </div>
    </div>

    <div class="popup" id="candidates-popup">
      <div class="popup-card">
        <h2 style="margin: 0; font-size: 20px; font-weight: 700">候选内容</h2>
        <div class="candidate-scroll" id="candidate-scroll"></div>
        <div class="candidate-load" id="candidate-load">向下滚动加载更多</div>
        <button class="btn" id="close-candidates-btn" style="width: 100%; margin-top: 10px">关闭</button>
      </div>
    </div>

    <div class="guide-overlay" id="guide-overlay">
      <div class="guide-panel">
        <h3 class="guide-title" id="guide-title">新手指引</h3>
        <p class="guide-subtitle is-hidden" id="guide-subtitle"></p>
        <p class="guide-text" id="guide-text">欢迎来到众创小说。</p>
        <div class="guide-progress" id="guide-progress">1 / 1</div>
        <div class="guide-actions">
          <button class="btn" id="guide-prev-btn">上一步</button>
          <button class="btn" id="guide-skip-btn">跳过</button>
          <button class="btn primary" id="guide-next-btn">下一步</button>
        </div>
      </div>
    </div>

    <script type="module" src="/novel.js"></script>
  </body>
</html>
