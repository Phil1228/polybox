<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>平方立方练习</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --card: #fff;
        --text: #1a1a1a;
        --line: #d7dce7;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      body { display: flex; justify-content: center; }
      .app {
        width: min(980px, 100%);
        min-height: 100dvh;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
      }
      .toolbar .left { justify-self: start; }
      .toolbar .center { justify-self: center; }
      .toolbar .right { justify-self: end; }
      .btn {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        color: var(--text);
        padding: 8px 12px;
        font-size: 14px;
        font-weight: 600;
      }
      .top-layout {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 12px;
      }
      .card {
        background: var(--card);
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(21, 35, 63, 0.08);
      }
      .question-card {
        min-height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .equation {
        font-size: clamp(28px, 8vw, 56px);
        font-weight: 700;
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }
      .answer {
        min-width: 2.2em;
        border-bottom: 4px solid #5d6472;
        text-align: center;
        padding-bottom: 6px;
      }
      .history-card {
        padding: 14px;
        display: flex;
        flex-direction: column;
        min-height: 180px;
      }
      .history-title { margin: 0 0 10px; font-size: 18px; }
      .history-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow: auto;
      }
      .history-item {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .keyboard {
        margin-top: auto;
        background: var(--card);
        border-radius: 16px;
        padding: 10px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .key {
        border: 1px solid var(--line);
        border-radius: 12px;
        min-height: 56px;
        font-size: 28px;
        font-weight: 600;
        background: var(--card);
      }
      .key[data-action="backspace"] {
        font-size: 22px;
        grid-column: span 2;
      }
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(0, 0, 0, 0.2);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 14px;
      }
      .overlay.is-open { display: flex; }
      .panel {
        width: min(92vw, 560px);
        max-height: 84vh;
        overflow: auto;
        background: var(--card);
        border-radius: 14px;
        padding: 14px;
      }
      .panel h2 { margin: 0 0 10px; font-size: 22px; }
      .settings-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      .settings-header h2 {
        margin: 0;
      }
      .settings-more-btn {
        border: 1px solid var(--line);
        border-radius: 999px;
        min-height: 34px;
        padding: 0 12px;
        font-size: 14px;
        font-weight: 600;
        background: #fff;
        color: var(--text);
      }
      .setting-item { margin-bottom: 12px; }
      .setting-label { font-size: 14px; color: #5d6472; margin-bottom: 8px; }
      .setting-control {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        min-height: 42px;
        padding: 0 10px;
        font-size: 16px;
      }
      .setting-options { display: flex; gap: 8px; flex-wrap: wrap; }
      .option-btn {
        border: 1px solid var(--line);
        border-radius: 999px;
        min-height: 34px;
        padding: 0 12px;
        background: #fff;
      }
      .option-btn.is-active { background: #2f6fff; border-color: #2f6fff; color: #fff; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .leaderboard-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .leaderboard-item {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        gap: 8px;
        align-items: center;
      }
      .history-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 30;
        background: rgba(0, 0, 0, 0);
      }
      @media (max-width: 760px) {
        .top-layout { grid-template-columns: 1fr; }
        .history-overlay.is-open { display: block; }
        .history-card {
          position: fixed;
          right: 12px;
          top: 66px;
          width: min(88vw, 330px);
          max-height: 66dvh;
          z-index: 40;
          display: none;
        }
        .history-card.is-open { display: flex; }
      }
    </style>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body>
    <main class="app">
      <section class="toolbar">
        <button class="btn left" id="settings-toggle">设置</button>
        <button class="btn center" id="leaderboard-toggle">排行榜</button>
        <button class="btn right" id="history-toggle">历史</button>
      </section>
      <section class="top-layout">
        <section class="question-card card">
          <div class="equation">
            <span class="answer" id="answer-display">&nbsp;</span>
            <span id="power-text">²</span>
            <span>=</span>
            <span id="target-text">25</span>
          </div>
        </section>
        <aside class="history-card card" id="history-card">
          <h2 class="history-title">本次练习历史</h2>
          <ul class="history-list" id="history-list"></ul>
        </aside>
      </section>
      <section class="keyboard" id="keyboard">
        <button class="key" data-num="1">1</button>
        <button class="key" data-num="2">2</button>
        <button class="key" data-num="3">3</button>
        <button class="key" data-num="4">4</button>
        <button class="key" data-num="5">5</button>
        <button class="key" data-num="6">6</button>
        <button class="key" data-num="7">7</button>
        <button class="key" data-num="8">8</button>
        <button class="key" data-num="9">9</button>
        <button class="key" data-num="0">0</button>
        <button class="key" data-action="backspace">⌫</button>
      </section>
    </main>
    <div class="history-overlay" id="history-overlay"></div>

    <section class="overlay" id="settings-modal">
      <div class="panel">
        <div class="settings-header">
          <h2>设置</h2>
          <button class="settings-more-btn" id="settings-more" type="button">more</button>
        </div>
        <div class="setting-item">
          <div class="setting-label">用户名</div>
          <input id="setting-username" class="setting-control" maxlength="10" placeholder="请输入用户名" />
        </div>
        <div class="setting-item">
          <div class="setting-label">练习类型</div>
          <div class="setting-options" id="practice-type-options">
            <button class="option-btn" data-value="square">平方</button>
            <button class="option-btn" data-value="cube">立方</button>
            <button class="option-btn" data-value="mixed">混合</button>
          </div>
        </div>
        <div class="actions">
          <button class="btn" id="settings-confirm">确定</button>
          <button class="btn" id="settings-cancel">取消</button>
        </div>
      </div>
    </section>

    <section class="overlay" id="leaderboard-modal">
      <div class="panel">
        <h2>排行榜</h2>
        <div class="setting-item">
          <div class="setting-label">类型</div>
          <div class="setting-options" id="leaderboard-type-options">
            <button class="option-btn" data-value="square">平方</button>
            <button class="option-btn" data-value="cube">立方</button>
            <button class="option-btn" data-value="mixed">混合</button>
          </div>
        </div>
        <ul class="leaderboard-list" id="leaderboard-list"></ul>
        <div class="actions">
          <button class="btn" id="leaderboard-close" style="grid-column: 1 / -1">关闭</button>
        </div>
      </div>
    </section>

    <section class="overlay" id="detail-modal">
      <div class="panel">
        <h2 id="detail-title">记录详情</h2>
        <ul class="history-list" id="detail-history-list"></ul>
        <div class="actions">
          <button class="btn" id="detail-close" style="grid-column: 1 / -1">返回</button>
        </div>
      </div>
    </section>

    <script type="module" src="/square-cube.js"></script>
  </body>
</html>
