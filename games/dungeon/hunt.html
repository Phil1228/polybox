<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>dungeon | 寻宝模式</title>
    <style>
      :root {
        --bg: #f6f1e8;
        --bg-deep: #f0e2cf;
        --ink: #1d1a16;
        --muted: #6b5c48;
        --line: rgba(29, 26, 22, 0.14);
        --card: #fffaf2;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: radial-gradient(circle at top, #fff3df 0%, var(--bg) 45%, var(--bg-deep) 100%);
        color: var(--ink);
        font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif;
      }
      body { padding: 12px; }
      .page {
        width: min(98vw, 1260px);
        margin: 0 auto;
      }
      .panel {
        padding: 14px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: var(--card);
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
      }
      h2 {
        margin: 0;
        font-size: 22px;
      }
      .btn {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 14px;
        font-weight: 700;
        background: #fff;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
      }
      .board {
        width: min(54vh, 46vw, 520px);
        max-width: 100%;
        aspect-ratio: 1 / 1;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(5, 1fr);
        gap: 8px;
      }
      .cell {
        border-radius: 12px;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        min-height: 0;
        aspect-ratio: 1 / 1;
        position: relative;
        overflow: hidden;
      }
      #hunt-board .cell { cursor: pointer; }
      .cell.revealed::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.38);
      }
      .cell-content {
        position: absolute;
        inset: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .cell-icon { width: 40px; height: 40px; display: block; }
      .hint-badge {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
        pointer-events: none;
        opacity: 0.5;
      }
      .hint-icon { width: 28px; height: 28px; display: block; }
      .hunt-layout {
        display: grid;
        grid-template-columns: auto minmax(240px, 1fr);
        gap: 12px;
        align-items: start;
      }
      .hunt-side {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hunt-piece-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .hunt-piece-row .piece-card {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hunt-piece-row .piece-preview-wrap {
        width: 100%;
        padding: 4px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid var(--line);
      }
      .hunt-piece-row .piece-preview {
        width: 100%;
        height: auto;
        max-height: 72px;
        object-fit: contain;
        cursor: default;
      }
      .hunt-info-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .hint-card,
      .hunt-status-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.75);
      }
      .hint-card { padding: 10px 12px; }
      .hint-card .label {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .hint-card .value {
        font-size: 18px;
        font-weight: 700;
      }
      .hunt-status-card { padding: 12px; }
      .status {
        color: var(--muted);
        font-size: 14px;
        margin: 0;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .actions .btn { width: 100%; }
      .uuid-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }
      .uuid-action-row {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .uuid-edit-btn {
        border: none;
        background: transparent;
        color: #6b5c48;
        font-size: 16px;
        cursor: pointer;
        line-height: 1;
        padding: 0;
      }
      .uuid-edit-btn.confirm {
        color: #2e7d32;
      }
      .uuid-cancel-btn {
        border: none;
        background: transparent;
        color: #c62828;
        font-size: 16px;
        cursor: pointer;
        line-height: 1;
        padding: 0;
        display: none;
      }
      .uuid-edit-input {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 14px;
        font-weight: 700;
      }
      .hunt-actions {
        padding-top: 2px;
      }
      .rotate-lock {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        background: rgba(22, 17, 12, 0.92);
        color: #fff7ea;
      }
      .rotate-lock-card {
        width: min(88vw, 360px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.08);
        padding: 18px 16px;
      }
      @media (max-width: 820px) {
        .hunt-layout {
          grid-template-columns: 1fr;
        }
        .board {
          width: min(86vw, 74vh, 460px);
          margin: 0 auto;
        }
      }
      @media (max-width: 640px) {
        .hunt-info-grid { grid-template-columns: 1fr; }
      }
      @media (orientation: portrait) and (max-width: 1024px) {
        body.mobile-landscape-required .page { display: none; }
        body.mobile-landscape-required .rotate-lock { display: flex; }
      }
    </style>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body data-default-mode="hunt">
    <main class="page">
      <section id="build-section" style="display:none;"></section>
      <section class="panel" id="hunt-section">
        <div class="section-head">
          <h2>寻宝模式</h2>
          <a class="btn" href="/dungeon.html">返回入口</a>
        </div>
        <div class="hunt-layout">
          <div class="board" id="hunt-board"></div>
          <div class="hunt-side">
            <div class="hunt-info-grid">
              <div class="hint-card">
                <div class="label">剩余机会</div>
                <div class="value" id="chances-left">5</div>
              </div>
              <div class="hint-card">
                <div class="label">状态</div>
                <div class="value" id="hunt-state">未开始</div>
              </div>
              <div class="hint-card">
                <div class="label">积分</div>
                <div class="value" id="hunt-score">0</div>
              </div>
              <div class="hint-card">
                <div class="uuid-head">
                  <div class="label" style="margin-bottom:0;">UUID</div>
                  <div class="uuid-action-row">
                    <button class="uuid-cancel-btn" id="hunt-uuid-cancel-btn" type="button" aria-label="取消编辑UUID">✕</button>
                    <button class="uuid-edit-btn" id="hunt-uuid-edit-btn" type="button" aria-label="编辑UUID">✏</button>
                  </div>
                </div>
                <div class="value" id="hunt-uuid-text">未指定</div>
                <input class="uuid-edit-input" id="hunt-uuid-edit-input" placeholder="输入10位UUID" maxlength="10" style="display:none;" />
              </div>
            </div>
            <div class="hunt-piece-row piece-list" id="piece-list"></div>
            <div class="hunt-status-card">
              <p class="status" id="hunt-status">暂无藏宝图，请先在建设模式保存。</p>
            </div>
            <div class="actions hunt-actions">
              <button class="btn" id="reload-hunt-btn" type="button">随机藏宝图</button>
              <button class="btn" id="restart-hunt-btn" type="button">重新挑战</button>
              <button class="btn" id="my-hunt-history-btn" type="button">历史记录</button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div class="rotate-lock" id="rotate-lock">
      <div class="rotate-lock-card">
        <div style="font-size:20px;font-weight:700;margin-bottom:8px;">请横屏使用</div>
        <div style="font-size:14px;line-height:1.6;">寻宝模式在移动端强制横屏，请旋转设备后继续。</div>
      </div>
    </div>
    <div id="hunt-history-modal" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.45);padding:20px;">
      <div style="max-width:600px;margin:0 auto;background:#fffaf2;border:1px solid rgba(29,26,22,.14);border-radius:14px;padding:14px;max-height:80vh;overflow:auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;">
          <h3 style="margin:0;">我的寻宝记录</h3>
          <button class="btn" id="hunt-history-close-btn" type="button">关闭</button>
        </div>
        <div id="hunt-history-list" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>
    </div>
    <script type="module" src="/dungeon.js"></script>
  </body>
</html>
