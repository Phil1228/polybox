<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>加工速度</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --card: #ffffff;
        --text: #1a1a1a;
        --line: #d7dce7;
        --primary: #2f6fff;
        --grid-cols: 3;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      body { padding: 16px 14px 24px; }
      .page { width: min(94vw, 760px); margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 10px;
      }
      .toolbar-left { justify-self: start; display: inline-flex; gap: 8px; }
      .toolbar-right { justify-self: end; }
      .btn {
        border: 1px solid var(--line);
        border-radius: 10px;
        min-height: 40px;
        padding: 0 12px;
        background: #fff;
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
      }
      .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
      .target-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
      .target-char {
        min-width: 38px; min-height: 38px; border: 1px solid var(--line); border-radius: 10px;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 22px; font-weight: 700; background: #fff;
      }
      .target-char.done { background: #e9f2ff; border-color: #9cc3ff; color: #1a63d4; }
      .meta { text-align: center; color: #6f7888; font-size: 14px; }
      .board { width: min(92vw, 420px); aspect-ratio: 1 / 1; margin: 12px auto 0; position: relative; touch-action: none; }
      .grid { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(var(--grid-cols), 1fr); gap: 10px; }
      .char-cell {
        border: 1px solid var(--line); border-radius: 12px; background: #fff;
        font-size: clamp(24px, 7vw, 36px); font-weight: 700; color: var(--text);
      }
      .canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .status { min-height: 22px; margin-top: 10px; text-align: center; color: #52617a; font-size: 14px; }

      .history-panel {
        position: fixed;
        top: 74px;
        right: 12px;
        width: min(84vw, 300px);
        max-height: 68vh;
        overflow: auto;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.16);
        display: none;
        z-index: 40;
      }
      .history-panel.is-open { display: block; }
      .history-title { margin: 0; font-size: 18px; }
      .history-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .history-item {
        border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
        display: flex; justify-content: space-between; gap: 10px; font-size: 14px;
      }
      .history-seq { font-weight: 700; }
      .history-time { color: #5f6f89; }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.28);
        display: none;
        z-index: 35;
      }
      .overlay.is-open { display: block; }

      .popup {
        position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.28);
        display: none; align-items: center; justify-content: center; padding: 14px;
      }
      .popup.is-open { display: flex; }
      .popup-card { width: min(92vw, 520px); background: #fff; border-radius: 14px; padding: 14px; }
      .popup-title { margin: 0; font-size: 22px; }
      .popup-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .field { margin-top: 10px; }
      .setting-options {
        display: inline-grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .option-btn.active {
        border-color: var(--primary);
        color: var(--primary);
        background: #eaf1ff;
      }
      .input {
        width: 100%; min-height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; font-size: 15px;
      }
      .rank-list { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .rank-item {
        border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
        display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px;
      }
      .rank-left { display: flex; gap: 8px; align-items: center; }
      .rank-no { width: 24px; text-align: center; font-weight: 700; color: #4d5870; }
      .top-btn-wrap { margin-bottom: 10px; }
      .level-tabs {
        margin-top: 10px;
        display: inline-grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        width: 100%;
      }
      @media (max-width: 760px) { .history-panel { top: 66px; right: 10px; } }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="toolbar">
        <div class="toolbar-left">
          <button class="btn" id="settings-btn">设置</button>
        </div>
        <button class="btn" id="leaderboard-btn">排行榜</button>
        <div class="toolbar-right">
          <button class="btn" id="history-btn">历史</button>
        </div>
      </section>

      <section class="card">
        <div class="target-row" id="target-row"></div>
        <div class="meta">请按住第一个字开始连线，按顺序穿过全部五个字</div>
        <div class="meta" id="progress-meta">进度：第 1 / 9 次</div>
        <div class="meta" id="timer-meta">本次用时：0.00 秒</div>
        <div class="meta" id="round-total-meta">本轮累计：0.00 秒</div>
        <div class="board" id="board">
          <div class="grid" id="grid"></div>
          <canvas class="canvas" id="path-canvas"></canvas>
        </div>
        <div class="status" id="status">准备开始</div>
      </section>
    </main>

    <div class="overlay" id="history-overlay"></div>
    <aside class="history-panel" id="history-panel">
      <h2 class="history-title">本轮历史</h2>
      <ul class="history-list" id="history-list"></ul>
    </aside>

    <section class="popup" id="settings-popup">
      <div class="popup-card">
        <div class="popup-header">
          <h2 class="popup-title">设置</h2>
          <button class="btn" id="settings-more-btn">more</button>
        </div>
        <div class="field">
          <div style="font-size: 14px; color: #63708a; margin-bottom: 6px">用户名（最多10个字）</div>
          <input class="input" id="username-input" maxlength="10" placeholder="请输入用户名" />
        </div>
        <div class="field">
          <div style="font-size: 14px; color: #63708a; margin-bottom: 6px">级别</div>
          <div class="setting-options">
            <button class="btn option-btn active" id="level-beginner-btn" data-level="beginner">初级</button>
            <button class="btn option-btn" id="level-advanced-btn" data-level="advanced">高级</button>
          </div>
        </div>
        <div class="field" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
          <button class="btn primary" id="save-settings-btn">保存</button>
          <button class="btn" id="close-settings-btn">关闭</button>
        </div>
      </div>
    </section>

    <section class="popup" id="leaderboard-popup">
      <div class="popup-card">
        <div class="top-btn-wrap">
          <button class="btn primary" id="restart-btn" style="width: 100%">再来一次</button>
        </div>
        <h2 class="popup-title" style="font-size: 20px">排行榜（前十名）</h2>
        <div class="level-tabs">
          <button class="btn option-btn active" id="rank-beginner-btn" data-level="beginner">初级</button>
          <button class="btn option-btn" id="rank-advanced-btn" data-level="advanced">高级</button>
        </div>
        <ul class="rank-list" id="leaderboard-list"></ul>
        <div class="field">
          <button class="btn" id="close-leaderboard-btn" style="width: 100%">关闭</button>
        </div>
      </div>
    </section>

    <script type="module" src="/processing-speed.js"></script>
  </body>
</html>
