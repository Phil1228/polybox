<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1a2e" />
    <meta name="description" content="POLYBOX 用户登录、注册与账户管理" />
    <title>用户中心 - POLYBOX</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/polybox.css" />
    <link rel="stylesheet" href="/user.css" />
  </head>
  <body class="polybox-page user-page">
    <header class="site-header">
      <div class="header-inner">
        <a class="logo" href="/">POLYBOX</a>
        <nav class="main-nav" aria-label="页面导航">
          <a href="/">返回首页</a>
        </nav>
        <div class="header-actions">
          <button type="button" class="icon-btn" id="theme-toggle" aria-label="切换浅色/深色主题">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"></path>
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="user-main">
      <div class="user-shell">
        <aside class="user-aside" aria-hidden="true">
          <p class="user-aside-eyebrow">POLYBOX ACCOUNT</p>
          <h1>用户中心</h1>
          <p>登录或注册账户，同步学习记录、排行榜与个性化设置，畅享 POLYBOX 旗下产品。</p>
        </aside>

        <div class="user-content">
          <section class="user-view user-card" id="auth-view">
            <header class="user-panel-head">
              <p class="user-panel-label">ACCOUNT</p>
              <h2>登录 / 注册</h2>
            </header>

            <div class="user-tabs">
              <button type="button" class="user-tab is-active" id="tab-login">登录</button>
              <button type="button" class="user-tab" id="tab-register">注册</button>
            </div>

            <div class="user-auth-panel is-open" id="login-panel">
              <div class="user-field">
                <label for="login-username">用户名</label>
                <input class="user-input" id="login-username" autocomplete="username" placeholder="4-16 位字母/数字/下划线" />
              </div>
              <div class="user-field">
                <label for="login-password">密码</label>
                <input class="user-input" id="login-password" type="password" autocomplete="current-password" placeholder="输入密码" />
              </div>
              <div class="user-actions">
                <button type="button" class="user-btn user-btn--primary" id="login-btn">登录</button>
                <button type="button" class="user-btn user-btn--secondary" id="to-register-btn">新用户注册</button>
              </div>
              <div class="user-message" id="login-message"></div>
            </div>

            <div class="user-auth-panel" id="register-panel">
              <div class="user-field">
                <label for="reg-username">用户名</label>
                <input class="user-input" id="reg-username" autocomplete="username" placeholder="4-16 位字母/数字/下划线" />
              </div>
              <div class="user-field">
                <label for="reg-password">密码</label>
                <input class="user-input" id="reg-password" type="password" autocomplete="new-password" placeholder="设置密码" />
              </div>
              <div class="user-actions">
                <button type="button" class="user-btn user-btn--primary" id="register-btn">注册</button>
              </div>
              <div class="user-message" id="register-message"></div>
            </div>
          </section>

          <section class="user-view user-card" id="profile-view">
            <div class="user-profile-top">
              <header class="user-panel-head">
                <p class="user-panel-label">PROFILE</p>
                <h2>用户信息</h2>
              </header>
              <button type="button" class="user-btn user-btn--danger" id="logout-btn">登出</button>
            </div>

            <div class="user-profile-grid">
              <div class="user-field">
                <label>用户名</label>
                <input class="user-input" id="profile-username" disabled />
              </div>
              <div class="user-field">
                <label for="profile-nickname">昵称</label>
                <input class="user-input" id="profile-nickname" placeholder="输入昵称" />
              </div>
            </div>

            <div class="user-field">
              <label for="theme-select">主题</label>
              <select class="user-input" id="theme-select">
                <option value="system">跟随系统</option>
                <option value="light">浅色</option>
                <option value="dark">深色</option>
              </select>
            </div>

            <div class="user-avatar-block">
              <label>头像</label>
              <div class="user-avatar-row">
                <img class="user-avatar-preview" id="avatar-preview" alt="头像预览" />
                <div class="user-avatar-grid" id="avatar-grid"></div>
              </div>
            </div>

            <div class="user-actions">
              <button type="button" class="user-btn user-btn--primary" id="save-profile-btn">保存资料</button>
              <button type="button" class="user-btn user-btn--secondary" id="go-home-btn">返回首页</button>
            </div>
            <div class="user-message" id="profile-message"></div>
          </section>
        </div>
      </div>
    </main>

    <script src="/user.js"></script>
  </body>
</html>
