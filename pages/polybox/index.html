<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>POLYBOX - 软件开发与电子商务</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #111a2e;
        --card: #121b2f;
        --text: #e7ecf7;
        --muted: #9ca8c4;
        --line: #2a3552;
        --primary: #5b8cff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: radial-gradient(circle at top, #17233f, var(--bg) 58%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        scroll-behavior: smooth;
      }
      body {
        display: flex;
        justify-content: center;
      }
      .page {
        width: min(100%, 1080px);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        padding: 14px clamp(14px, 4vw, 32px);
        background: rgba(12, 18, 34, 0.92);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(10px);
      }
      .brand {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .menu {
        display: flex;
        gap: 14px;
        justify-content: center;
      }
      .menu a {
        text-decoration: none;
        color: var(--text);
        font-weight: 600;
        font-size: 14px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid transparent;
      }
      .menu a:hover {
        border-color: rgba(91, 140, 255, 0.4);
        color: #cfe0ff;
      }
      .user-btn {
        justify-self: end;
        width: 38px;
        height: 38px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
        text-decoration: none;
      }
      .user-btn svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
      }
      .section {
        padding: clamp(20px, 6vw, 46px) clamp(14px, 4vw, 32px);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .section h2 {
        margin: 0;
        font-size: 20px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
      }
      .card p {
        margin: 8px 0 0;
        color: var(--muted);
        line-height: 1.65;
      }
      .products {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .link {
        display: block;
        text-decoration: none;
        color: var(--text);
        border: 1px solid #314063;
        border-radius: 12px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.02);
        transition: transform 0.14s ease, border-color 0.14s ease;
      }
      .link:active {
        transform: scale(0.99);
      }
      .name {
        font-weight: 700;
        font-size: 17px;
      }
      .desc {
        margin-top: 6px;
        font-size: 14px;
        color: var(--muted);
      }
      .footer {
        margin-top: auto;
        text-align: center;
        padding: 18px 12px 28px;
        color: #7c89aa;
        font-size: 13px;
        border-top: 1px solid var(--line);
      }
      @media (min-width: 860px) {
        .products {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 720px) {
        .topbar {
          grid-template-columns: 1fr auto;
          grid-template-areas:
            "brand user"
            "menu menu";
          gap: 10px;
        }
        .brand {
          grid-area: brand;
        }
        .user-btn {
          grid-area: user;
        }
        .menu {
          grid-area: menu;
          justify-content: flex-start;
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="topbar">
        <div class="brand">POLYBOX</div>
        <nav class="menu">
          <a href="#services">业务类型</a>
          <a href="#products">产品列表</a>
        </nav>
        <a class="user-btn" href="/user.html" aria-label="用户管理">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
          </svg>
        </a>
      </section>

      <section class="section" id="services">
        <h2>业务类型</h2>
        <div class="card">
          <p>1) 软件开发服务：Web 应用、后端接口、支付集成、部署自动化。</p>
          <p>2) 电子商务：交易流程设计、支付接入、会员与内容型增长产品建设。</p>
        </div>
      </section>

      <section class="section" id="products">
        <h2>产品列表</h2>
        <div class="products">
          <a class="link" href="/minimaths.html">
            <div class="name">MiniMaths</div>
            <div class="desc">移动端数学练习与排行榜系统</div>
          </a>
          <a class="link" href="/mini-eng.html">
            <div class="name">miniEng</div>
            <div class="desc">英语语音作答与 AI 评分模块</div>
          </a>
          <a class="link" href="/xiaoguwen.html">
            <div class="name">小古文</div>
            <div class="desc">古诗文互动填空学习模块</div>
          </a>
          <a class="link" href="/novel.html">
            <div class="name">novel</div>
            <div class="desc">众创小说树状分支创作与阅读平台</div>
          </a>
          <a class="link" href="/processing-speed.html">
            <div class="name">加工速度</div>
            <div class="desc">加工速度训练与排行榜</div>
          </a>
        </div>
      </section>

      <footer class="footer">POLYBOX@2025</footer>
    </main>
  </body>
</html>
