<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>POLYBOX - 软件开发与电子商务</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/theme.css" />
    <style>
      :root {
        --topbar-height: 96px;
        --topbar-margin: 0px;
      }
      :root[data-theme="light"] {
        --page-bg: radial-gradient(circle at 18% -10%, #e6f6ff 0%, #f2f7ff 42%, #edf1ff 100%);
        --panel: rgba(230, 246, 255, 0.78);
        --card: rgba(255, 255, 255, 0.9);
        --line: rgba(24, 44, 88, 0.18);
        --line-strong: rgba(24, 44, 88, 0.38);
        --text: #0a1328;
        --muted: #3f547a;
      }
      :root[data-theme="dark"] {
        --page-bg: radial-gradient(circle at 18% -10%, #1a2b58 0%, #0b142c 55%, #070b18 100%);
        --panel: rgba(11, 20, 44, 0.82);
        --card: rgba(10, 18, 40, 0.92);
        --line: rgba(90, 190, 255, 0.2);
        --line-strong: rgba(90, 190, 255, 0.42);
        --text: #eaf2ff;
        --muted: #9fb3df;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: var(--page-bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        justify-content: center;
        overflow-x: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(58, 166, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(58, 166, 255, 0.08) 1px, transparent 1px);
        background-size: 28px 28px;
        pointer-events: none;
        z-index: 0;
      }
      .page {
        width: min(100%, 1080px);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: calc(var(--topbar-height) + var(--topbar-margin) + 18px) clamp(14px, 4vw, 32px) 36px;
        gap: 22px;
        position: relative;
        z-index: 1;
        --glow-a-x0: 0px;
        --glow-a-y0: 0px;
        --glow-a-x1: 6px;
        --glow-a-y1: -10px;
        --glow-a-x2: -8px;
        --glow-a-y2: 6px;
        --glow-a-x3: 5px;
        --glow-a-y3: 10px;
        --glow-a-x4: 0px;
        --glow-a-y4: 0px;
        --glow-a-float: 5.5s;
        --glow-a-drift: 9s;
        --glow-b-x0: 0px;
        --glow-b-y0: 0px;
        --glow-b-x1: -6px;
        --glow-b-y1: 8px;
        --glow-b-x2: 7px;
        --glow-b-y2: -6px;
        --glow-b-x3: -5px;
        --glow-b-y3: -10px;
        --glow-b-x4: 0px;
        --glow-b-y4: 0px;
        --glow-b-float: 6.2s;
        --glow-b-drift: 10.5s;
      }
      @media (min-width: 980px) {
        .page::before,
        .page::after {
          content: "";
          position: absolute;
          top: 140px;
          bottom: 140px;
          width: 120px;
          pointer-events: none;
          opacity: 1;
          background:
            radial-gradient(circle, rgba(66, 211, 255, 0.75) 0 2px, transparent 3px),
            radial-gradient(circle, rgba(66, 211, 255, 0.55) 0 1.5px, transparent 3px),
            radial-gradient(circle, rgba(120, 245, 255, 0.6) 0 2.5px, transparent 4px),
            linear-gradient(180deg, rgba(66, 211, 255, 0.12), transparent 65%);
          background-size: 100px 100px, 140px 140px, 180px 180px, 100% 100%;
          animation:
            glow-float var(--glow-float, 5.5s) ease-in-out infinite,
            glow-drift var(--glow-drift, 9s) linear infinite;
          filter: drop-shadow(0 0 16px rgba(66, 211, 255, 0.55));
        }
        .page::before {
          left: -140px;
          --glow-float: var(--glow-a-float);
          --glow-drift: var(--glow-a-drift);
          --gx0: var(--glow-a-x0);
          --gy0: var(--glow-a-y0);
          --gx1: var(--glow-a-x1);
          --gy1: var(--glow-a-y1);
          --gx2: var(--glow-a-x2);
          --gy2: var(--glow-a-y2);
          --gx3: var(--glow-a-x3);
          --gy3: var(--glow-a-y3);
          --gx4: var(--glow-a-x4);
          --gy4: var(--glow-a-y4);
        }
        .page::after {
          right: -140px;
          animation-delay: 1.8s, 0s;
          --glow-float: var(--glow-b-float);
          --glow-drift: var(--glow-b-drift);
          --gx0: var(--glow-b-x0);
          --gy0: var(--glow-b-y0);
          --gx1: var(--glow-b-x1);
          --gy1: var(--glow-b-y1);
          --gx2: var(--glow-b-x2);
          --gy2: var(--glow-b-y2);
          --gx3: var(--glow-b-x3);
          --gy3: var(--glow-b-y3);
          --gx4: var(--glow-b-x4);
          --gy4: var(--glow-b-y4);
        }
      }
      .topbar {
        position: fixed;
        top: var(--topbar-margin);
        left: var(--topbar-margin);
        right: var(--topbar-margin);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        height: var(--topbar-height);
        padding: 14px clamp(14px, 4vw, 32px);
        background-color: var(--panel);
        backdrop-filter: blur(10px);
        border-bottom: 2px solid var(--line-strong);
        border-radius: 0;
      }
      .topbar-inner {
        width: min(100%, 1080px);
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
      }
      .brand {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .menu {
        display: flex;
        gap: 14px;
        justify-content: center;
      }
      .menu a {
        text-decoration: none;
        color: var(--text);
        font-weight: 600;
        font-size: 14px;
        padding: 8px 14px;
        border-radius: 999px;
        border: 2px solid var(--line-strong);
        background: var(--card);
        transition: border-color 0.14s ease, transform 0.14s ease, color 0.14s ease;
      }
      .menu a:hover {
        border-color: #42d3ff;
        color: #42d3ff;
        transform: translateY(-1px);
      }
      .user-btn {
        justify-self: end;
        width: 40px;
        height: 40px;
        border-radius: 999px;
        border: 2px solid var(--line-strong);
        background: var(--card);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
        text-decoration: none;
      }
      .user-btn svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
      }
      .user-btn img {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        object-fit: cover;
        display: none;
      }

      .section {
        background: var(--panel);
        border: 1.5px solid var(--line-strong);
        border-radius: 18px;
        padding: clamp(18px, 4vw, 28px);
        box-shadow:
          0 8px 18px rgba(15, 23, 42, 0.08),
          0 2px 6px rgba(15, 23, 42, 0.04);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .section h2 {
        margin: 0;
        font-size: 20px;
      }
      .card {
        background: var(--card);
        border: 2px solid var(--line-strong);
        border-radius: 14px;
        padding: 16px;
      }
      .card p {
        margin: 8px 0 0;
        color: var(--muted);
        line-height: 1.65;
      }
      .products {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .link {
        display: block;
        text-decoration: none;
        color: var(--text);
        border: 2px solid var(--line-strong);
        border-radius: 12px;
        padding: 14px;
        background: var(--card);
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
        transition: border-color 0.14s ease, transform 0.14s ease;
      }
      .link:hover {
        border-color: #42d3ff;
        transform: translateY(-1px);
      }
      .name {
        font-weight: 700;
        font-size: 17px;
      }
      .desc {
        margin-top: 6px;
        font-size: 14px;
        color: var(--muted);
      }
      .footer {
        margin-top: auto;
        text-align: center;
        padding: 18px 12px 0;
        color: var(--muted);
        font-size: 13px;
      }
      @keyframes glow-float {
        0% {
          opacity: 0.55;
          transform: translateY(-8px);
        }
        50% {
          opacity: 1;
          transform: translateY(8px);
        }
        100% {
          opacity: 0.6;
          transform: translateY(-6px);
        }
      }
      @keyframes glow-drift {
        0% {
          transform: translate(var(--gx0), var(--gy0));
        }
        25% {
          transform: translate(var(--gx1), var(--gy1));
        }
        50% {
          transform: translate(var(--gx2), var(--gy2));
        }
        75% {
          transform: translate(var(--gx3), var(--gy3));
        }
        100% {
          transform: translate(var(--gx4), var(--gy4));
        }
      }

      @media (min-width: 860px) {
        .products {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 720px) {
        .topbar-inner {
          grid-template-columns: 1fr auto;
          grid-template-areas:
            "brand user"
            "menu menu";
          gap: 10px;
        }
        .brand {
          grid-area: brand;
        }
        .user-btn {
          grid-area: user;
        }
        .menu {
          grid-area: menu;
          justify-content: flex-start;
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">POLYBOX</div>
        <nav class="menu">
          <a href="#services">业务类型</a>
          <a href="#products">产品列表</a>
        </nav>
        <a class="user-btn" href="/user.html" aria-label="用户管理">
          <img id="user-avatar" alt="用户头像" />
          <svg viewBox="0 0 24 24" aria-hidden="true" id="user-avatar-fallback">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
          </svg>
        </a>
      </div>
    </header>

    <main class="page">
      <section class="section" id="services">
        <h2>业务类型</h2>
        <div class="card">
          <p>1) 软件开发服务：Web 应用、后端接口、支付集成、部署自动化。</p>
          <p>2) 电子商务：交易流程设计、支付接入、会员与内容型增长产品建设。</p>
        </div>
      </section>

      <section class="section" id="products">
        <h2>产品列表</h2>
        <div class="products">
          <a class="link" href="/minimaths.html">
            <div class="name">MiniMaths</div>
            <div class="desc">移动端数学练习与排行榜系统</div>
          </a>
          <a class="link" href="/square-cube.html">
            <div class="name">平方立方练习</div>
            <div class="desc">平方数与立方数速算训练与排行榜</div>
          </a>
          <a class="link" href="/mini-eng.html">
            <div class="name">miniEng</div>
            <div class="desc">英语语音作答与 AI 评分模块</div>
          </a>
          <a class="link" href="/xiaoguwen.html">
            <div class="name">小古文</div>
            <div class="desc">古诗文互动填空学习模块</div>
          </a>
          <a class="link" href="/novel.html">
            <div class="name">novel</div>
            <div class="desc">众创小说树状分支创作与阅读平台</div>
          </a>
          <a class="link" href="/processing-speed.html">
            <div class="name">加工速度</div>
            <div class="desc">加工速度训练与排行榜</div>
          </a>
          <a class="link" href="/dungeon.html">
            <div class="name">dungeon</div>
            <div class="desc">迷宫寻宝（Treasure Park 风格探索）</div>
          </a>
        </div>
      </section>

      <footer class="footer">POLYBOX@2025</footer>
    </main>
    <script>
      (function () {
        const TOKEN_KEY = "minimaths_user_token";
        const avatarImg = document.getElementById("user-avatar");
        const fallbackIcon = document.getElementById("user-avatar-fallback");
        const token = localStorage.getItem(TOKEN_KEY) || "";

        if (!avatarImg || !fallbackIcon || !token) return;

        fetch("/api/users/me", {
          headers: { Authorization: "Bearer " + token },
        })
          .then((res) => res.json())
          .then((data) => {
            const avatar = data && data.user && data.user.avatar ? data.user.avatar : "";
            if (!avatar) return;
            avatarImg.src = avatar;
            avatarImg.style.display = "block";
            fallbackIcon.style.display = "none";
          })
          .catch(() => {});
      })();
    </script>
    <script>
      (function () {
        const page = document.querySelector(".page");
        if (!page || window.matchMedia("(max-width: 979px)").matches) return;

        const rand = (min, max) => Math.random() * (max - min) + min;
        const pick = (prefix) => {
          page.style.setProperty(`--${prefix}-x0`, `${rand(-4, 4).toFixed(1)}px`);
          page.style.setProperty(`--${prefix}-y0`, `${rand(-4, 4).toFixed(1)}px`);
          page.style.setProperty(`--${prefix}-x1`, `${rand(-10, 10).toFixed(1)}px`);
          page.style.setProperty(`--${prefix}-y1`, `${rand(-12, 12).toFixed(1)}px`);
          page.style.setProperty(`--${prefix}-x2`, `${rand(-12, 12).toFixed(1)}px`);
          page.style.setProperty(`--${prefix}-y2`, `${rand(-12, 12).toFixed(1)}px`);
          page.style.setProperty(`--${prefix}-x3`, `${rand(-10, 10).toFixed(1)}px`);
          page.style.setProperty(`--${prefix}-y3`, `${rand(-12, 12).toFixed(1)}px`);
          page.style.setProperty(`--${prefix}-x4`, `${rand(-4, 4).toFixed(1)}px`);
          page.style.setProperty(`--${prefix}-y4`, `${rand(-4, 4).toFixed(1)}px`);
          page.style.setProperty(`--${prefix}-float`, `${rand(4.8, 7.2).toFixed(2)}s`);
          page.style.setProperty(`--${prefix}-drift`, `${rand(8, 14).toFixed(2)}s`);
        };

        const randomize = () => {
          pick("glow-a");
          pick("glow-b");
        };

        randomize();
        setInterval(randomize, rand(6000, 10000));
      })();
    </script>
  </body>
</html>
